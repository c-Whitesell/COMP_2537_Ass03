<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Memory Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">🎮 Pokemon Memory Game 🎮</h1>

        <div class="controls-section">
          <div class="difficulty-group">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty" class="difficulty-select">
              <option value="easy">Easy (6 cards, 20s)</option>
              <option value="medium" selected>Medium (12 cards, 90s)</option>
              <option value="hard">Hard (16 cards, 120s)</option>
            </select>
          </div>

          <div class="button-group">
            <button id="startBtn" class="btn btn-start">Start Game</button>
            <button id="resetBtn" class="btn btn-reset">Reset</button>
          </div>

          <div class="theme-group">
            <label for="theme">Theme:</label>
            <select id="theme" class="theme-select">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        </div>
      </header>

      <div class="status-section">
        <div class="status-item">
          <span class="status-label">Time Left:</span>
          <span id="timer" class="status-value timer-value">90</span>s
        </div>
        <div class="status-item">
          <span class="status-label">Clicks:</span>
          <span id="clicks" class="status-value">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">Pairs Matched:</span>
          <span id="matched" class="status-value">0</span>/<span
            id="totalPairs"
            class="status-value"
            >6</span
          >
        </div>
        <div class="status-item">
          <span class="status-label">Pairs Left:</span>
          <span id="pairsLeft" class="status-value">6</span>
        </div>
        <button id="powerUpBtn" class="btn btn-powerup">⚡ Power-up</button>
      </div>

      <div id="game_grid" class="game-grid"></div>

      <div id="gameOverModal" class="modal hidden">
        <div class="modal-content">
          <h2 id="gameOverTitle">Game Over!</h2>
          <p id="gameOverMessage">Better luck next time!</p>
          <button id="modalResetBtn" class="btn btn-start">Play Again</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
